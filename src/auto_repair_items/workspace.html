<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料・見積ワークスペース</title>
<style>body{margin:0;background:#f4f5ef;color:#243b35;font:16px system-ui}header,main{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #ccd7cb}h1{margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#225d48;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}section{background:white;border:1px solid #dce3d9;border-radius:12px;padding:24px;margin:18px 0}label{display:grid;gap:6px;margin:12px 0}input,select,textarea{font:inherit;padding:10px;border:1px solid #b9c8bc;border-radius:6px;box-sizing:border-box;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f5ef;padding:15px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow:auto}.note{color:#63766d}#status{position:sticky;top:0;background:#e8eee2;padding:12px}a{color:#225d48}</style>
<header><small>材料マスタ / 統合版</small><h1>材料から見積、実績まで</h1><p class="note">ローカル検証用。初期データは架空値です。PDF・OCR・卸APIの実接続はありません。</p><nav><button data-view="dashboard">確認状況</button><button data-view="register">材料・価格登録</button><button data-view="import">CSV取込</button><button data-view="quote">見積作成・再表示</button><button data-view="usage">実使用量</button><a href="/ideas">30案の個別機能</a></nav></header>
<main><p id="status" role="status">読み込み中</p>
<section id="dashboard"><h2>価格と確認状況</h2><button id="refresh">再読込</button><div id="overview"></div></section>
<section id="register" hidden><h2>材料・価格の登録</h2><form id="registerForm"><div class="grid">
<label>材料ID<input name="item_id" required></label><label>材料名<input name="name" required></label><label>分類<select name="category"><option>塗料</option><option>部品</option><option>溶剤</option><option>消耗品</option></select></label><label>単位<input name="unit" value="ml" required></label><label>単価<input name="unit_price" inputmode="decimal" required></label><label>価格区分<select name="price_type"><option>販売</option><option>仕入</option></select></label><label>出所<input name="source" required></label><label>価格更新日<input name="updated_at" type="date" required></label><label>人が確認した日<input name="checked_at" type="date" required></label><label>仕入先ID（任意）<input name="supplier_id"></label><label>有効開始日<input name="valid_from" type="date" required></label><label>有効終了日（新規は期限なし、更新は既存期限を引継ぎ）<input name="valid_until" type="date"></label><label>確認者<input name="confirmed_by" required></label></div><label>取引条件（変更時だけ入力。空欄なら既存条件を引継ぎ）<textarea name="conditions" rows="2" placeholder='{"currency":"JPY","freight_basis":"included"}'></textarea></label><label>登録・変更理由<input name="reason" required></label><button>確認して価格版を保存</button></form></section>
<section id="import" hidden><h2>CSV取込と行の承認</h2><p>列名：item_id,name,category,unit,unit_price,price_type,source,updated_at</p><form id="importForm"><label>CSVファイル<input id="csvFile" type="file" accept=".csv,text/csv"></label><label>CSV本文<textarea name="csv_text" rows="6" required></textarea></label><label>出所<input name="source" required></label><button>候補を読み込む</button></form><div id="candidates"></div><form id="approveForm" hidden><label>確認者<input name="confirmed_by" required></label><button>選択した候補を承認して登録</button></form></section>
<section id="quote" hidden><h2>見積の作成・保存</h2><form id="quoteForm"><div class="grid"><label>見積ID<input name="quote_id" required></label><label>価格適用日<input name="as_of" type="date" required></label><label>確認者<input name="confirmed_by" required></label></div><div id="quoteLines"></div><button type="button" id="addLine">材料を追加</button> <button>単価を固定して保存</button></form><hr><form id="getForm"><label>保存済み見積ID<input name="quote_id" required></label><button>保存時点の見積を表示</button></form><div id="savedQuote"></div></section>
<section id="usage" hidden><h2>実使用量と見積量の比較</h2><form id="usageForm"><div class="grid"><label>見積ID<input name="quote_id" required></label><label>見積行ID<input name="quote_line_id" required></label><label>実使用量<input name="actual_qty" inputmode="decimal" required></label><label>確認者<input name="confirmed_by" required></label></div><label>差分の理由<input name="reason" required></label><button>実績を記録</button></form><div id="usageResult"></div></section></main>
<script>
const $=s=>document.querySelector(s);let batch=null;const status=s=>$('#status').textContent=s;
const fields=f=>Object.fromEntries(new FormData(f));
async function api(payload){const r=await fetch('/api/workspace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.error);return data.result}
function show(node,value){node.replaceChildren();const pre=document.createElement('pre');pre.textContent=JSON.stringify(value,null,2);node.append(pre)}
function table(node,rows,keys){const wrap=document.createElement('div');wrap.className='scroll';const t=document.createElement('table');const head=t.insertRow();keys.forEach(([key,label])=>{const c=document.createElement('th');c.textContent=label;head.append(c)});rows.forEach(row=>{const tr=t.insertRow();keys.forEach(([key])=>tr.insertCell().textContent=row[key]??'未確認')});wrap.append(t);node.append(wrap)}
async function task(fn){try{status('処理中…');await fn();status('完了しました')}catch(e){status('要確認：'+e.message)}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==b.dataset.view));
async function refresh(){const result=await api({action:'dashboard',as_of:new Date().toLocaleDateString('sv-SE')});renderDashboard(result)}
function renderDashboard(result){const node=$('#overview');node.replaceChildren();const p=document.createElement('p');p.textContent=`材料 ${result.summary.item_count} 件 / 価格 ${result.summary.price_count} 件 / 要確認 ${result.summary.issue_count} 件`;node.append(p);table(node,result.inventory.map(row=>({...row,check:row.issues.length?row.issues.join('・'):'確認済み',valid_until:row.valid_until||'期限なし'})),[['name','材料'],['price_type','区分'],['unit_price','単価'],['unit','単位'],['supplier_id','仕入先'],['valid_until','有効期限'],['check','確認状況']]);const h=document.createElement('h3');h.textContent='保存済み見積';node.append(h);result.quotes.forEach(quote=>{const b=document.createElement('button');b.textContent=quote.quote_id+' を再表示';b.onclick=()=>task(async()=>{document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='quote');renderQuote(await api({action:'get_quote',quote_id:quote.quote_id}))});node.append(b)})}
$('#refresh').onclick=()=>task(refresh);
$('#registerForm').onsubmit=e=>{e.preventDefault();task(async()=>{const data=fields(e.target),item={};['item_id','name','category','unit','unit_price','price_type','source','updated_at'].forEach(k=>{item[k]=data[k];delete data[k]});if(data.conditions.trim())data.conditions=JSON.parse(data.conditions);else delete data.conditions;if(!data.valid_until)delete data.valid_until;if(!data.supplier_id.trim())delete data.supplier_id;await api({action:'register',item,...data});await refresh()})};
$('#csvFile').onchange=async e=>{if(e.target.files[0])$('#importForm textarea').value=await e.target.files[0].text()};
$('#importForm').onsubmit=e=>{e.preventDefault();task(async()=>{const data=fields(e.target);batch=await api({action:'stage_csv',...data});$('#candidates').replaceChildren();(batch.staged_rows||[]).forEach(row=>{const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.value=row.record_id;box.disabled=!!row.errors?.length;box.style.width='auto';label.append(box,document.createTextNode(JSON.stringify(row.item||row.errors)));$('#candidates').append(label)});$('#approveForm').hidden=false})};
$('#approveForm').onsubmit=e=>{e.preventDefault();task(async()=>{const candidate_ids=[...$('#candidates').querySelectorAll('input:checked')].map(x=>x.value);const result=await api({action:'approve_import',import_batch_id:batch.import_batch_id,candidate_ids,...fields(e.target)});show($('#candidates'),result);$('#approveForm').hidden=true;await refresh()})};
function addLine(){const row=document.createElement('fieldset');row.className='grid';for(const [key,label,value] of [['item_id','材料ID',''],['quantity','数量','1'],['unit','単位','ml'],['supplier_id','仕入先ID（任意）','']]){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.name=key;input.value=value;input.required=key!=='supplier_id';l.append(input);row.append(l)}const remove=document.createElement('button');remove.type='button';remove.textContent='この行を削除';remove.onclick=()=>row.remove();row.append(remove);$('#quoteLines').append(row)}
$('#addLine').onclick=addLine;addLine();
function renderQuote(result){const quote=result.quote;$('#savedQuote').replaceChildren();const p=document.createElement('p');p.textContent='保存時点の見積 '+quote.quote_id+' / 小計 '+quote.subtotal+' 円（税・端数処理前）';$('#savedQuote').append(p);table($('#savedQuote'),quote.lines,[['quote_line_id','見積行ID'],['name','材料名'],['quantity','数量'],['unit','単位'],['unit_price_snapshot','保存単価'],['line_total','金額']]);$('#usageForm [name=quote_id]').value=quote.quote_id;if(quote.lines[0])$('#usageForm [name=quote_line_id]').value=quote.lines[0].quote_line_id}
$('#quoteForm').onsubmit=e=>{e.preventDefault();task(async()=>{const lines=[...$('#quoteLines').children].map(row=>({...Object.fromEntries([...row.querySelectorAll('input')].map(i=>[i.name,i.value])),price_type:'販売'}));renderQuote(await api({action:'save_quote',quote_id:e.target.quote_id.value,as_of:e.target.as_of.value,confirmed_by:e.target.confirmed_by.value,lines}))})};
$('#getForm').onsubmit=e=>{e.preventDefault();task(async()=>renderQuote(await api({action:'get_quote',...fields(e.target)})))};
$('#usageForm').onsubmit=e=>{e.preventDefault();task(async()=>show($('#usageResult'),await api({action:'record_usage',...fields(e.target)})))};
document.querySelectorAll('input[type=date]').forEach(i=>{if(i.name!=='valid_until')i.value=new Date().toLocaleDateString('sv-SE')});task(refresh);
</script></html>

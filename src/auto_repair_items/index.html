<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>材料台帳 · 30の道具</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#23362d;background:#f6f5ee;--green:#255c45;--line:#dadfd6}
*{box-sizing:border-box}body{margin:0}header{padding:24px max(24px,calc((100vw - 1280px)/2));border-bottom:1px solid var(--line);background:#fff}
.brand{font-size:24px;font-weight:750;margin:0}.tag{display:inline-block;color:#765514;background:#fff2cd;padding:5px 10px;border-radius:4px;font-size:12px}
header p{color:#607067;font-size:14px;margin:8px 0}.layout{max-width:1280px;margin:32px auto;display:grid;grid-template-columns:260px 1fr;gap:28px;padding:0 24px}
aside{height:calc(100vh - 190px);overflow:auto}button,input,textarea,select{font:inherit}button{cursor:pointer}.idea{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 8px;line-height:1.5;font-size:13px}.idea span{display:inline-block;width:38px;color:#6e7e74;font-size:11px}.idea.active{background:#e5eee4;color:var(--green);font-weight:700;border-radius:6px}.count{font-size:12px;color:#68766c;margin-bottom:12px}
main{min-width:0}h1{font-size:28px;margin:8px 0 12px;letter-spacing:-.02em}#description{color:#5a6b60;line-height:1.8}section{margin-top:24px;background:white;border:1px solid var(--line);padding:24px;border-radius:10px}h2{font-size:16px;margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;font-weight:600}input,textarea,select{display:block;width:100%;margin-top:7px;border:1px solid #b8c5b8;border-radius:5px;padding:10px;background:#fdfdfb;color:#23362d}textarea{min-height:110px;font-family:monospace;font-weight:400;font-size:12px}label.wide{grid-column:1/-1}.help{font-size:12px;color:#6a796f;line-height:1.7}.submit{margin-top:24px;border:0;background:var(--green);color:white;border-radius:5px;padding:12px 26px;font-weight:700}.secondary{margin-left:12px;background:transparent;border:1px solid var(--line);padding:10px 16px;border-radius:5px;font-size:13px}
#status{margin-top:16px;font-size:14px;white-space:pre-wrap}#status.error{color:#9e382f}.result{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:16px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #e2e6df;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}th{color:#637268;font-weight:500;background:#f7f9f4}td{max-width:420px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.blank{color:#748175;font-size:14px}.pill{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:5px 10px}.nested{margin-left:6px}details summary{cursor:pointer;font-size:13px;color:#657366}footer{font-size:12px;color:#6a786c;padding:0 24px 32px;max-width:1280px;margin:auto}
@media(max-width:760px){.layout{display:block;margin:20px auto;padding:0 16px}aside{height:auto;max-height:180px;border-bottom:1px solid var(--line);margin-bottom:24px}.fields{grid-template-columns:1fr}section{padding:18px}header{padding:20px 16px}h1{font-size:24px}.secondary{margin:12px 0 0 10px}}
</style>
<header><p class="brand">材料台帳 <span class="tag">Simulator · すべて架空値</span></p><p>部品・塗料・溶剤・消耗品の価格と、見積もりに使った根拠を残す。</p></header>
<div class="layout"><aside aria-label="30案の選択"><div id="count" class="count">読み込み中…</div><nav id="ideas"></nav></aside>
<main><span id="idea_id" class="pill"></span><h1 id="title">材料の道具を選ぶ</h1><p id="description"></p>
<section><h2>入力と確認</h2><p class="help">例示値は実価格ではありません。承認者の入力は人による確認の記録です。PDF・OCR・卸接続は読取候補を使うシミュレーションです。</p><form id="form"><div id="fields" class="fields"></div><button class="submit" type="submit">確認して実行</button><button id="reset" type="button" class="secondary">架空の入力例に戻す</button></form><div id="status" role="status"></div></section>
<section><h2>結果・保存した根拠</h2><div id="result" class="result"><p class="blank">実行結果がここに表示されます。未確認の価格は0円にせず、確認が必要な項目を表示します。</p></div></section>
<section><h2>保存済み価格版</h2><button id="history_button" class="secondary" type="button">台帳を再表示</button><div id="history" class="result"></div></section>
</main></div><footer>単位・価格区分・期限を揃えて確認。過去の見積価格は保存時点のまま保持。外部サービスへの通信は行いません。</footer>
<script>
const labels={item_id:'品目ID',name:'品名',category:'分類',unit:'基準単位',unit_price:'単価（架空・円）',price_type:'価格区分',source:'出所',updated_at:'確認日',confirmed_by:'確認・承認した人',reason:'理由',action:'操作',maker:'メーカー',raw_code:'色コードの原表記',finish:'仕上げ',supplier_id:'仕入先ID',source_unit:'元の単位',base_unit:'換算後の単位',factor:'入数・換算係数',quantity:'数量',package_price:'包装価格',evidence:'換算・使用量の根拠',item:'品目',as_of:'確認する日',valid_from:'有効開始日',valid_until:'有効期限',price_version_id:'価格版ID',formula_id:'配合ID',formula_version:'配合版',formula_lines:'構成材料',lines:'明細',ratio:'配合比',total_quantity:'必要総量',operation_id:'工程ID',panel_id:'部位ID',finish_type:'仕上げ',area_band:'面積帯',low_qty:'数量下限',typical_qty:'標準数量',high_qty:'数量上限',csv_text:'CSVの表（品目情報のみ）',field_map:'列の対応',rows:'読取候補の明細（架空値）',sheet_name:'シート名',xlsx_base64:'Excelファイル',document_id:'伝票参照ID',page:'ページ',region:'選択した明細範囲',candidates:'確認待ちの候補',terms_status:'利用条件の確認状態',confirmed_fields:'確認した項目',corrections:'訂正する項目',quote_id:'見積ID',quote_line_id:'見積行ID',estimated_qty:'見積数量',actual_qty:'実使用量',multiplier:'掛率（人が決めた値）',stage:'丸め対象',rounding_mode:'丸め方式',decimal_places:'小数桁数',min_qty:'適用最小数量',checked_at:'人が確認した日',source_updated_at:'出所の更新日',status:'確認状態',decision:'採用判断',amount:'金額',old_price:'変更前の価格',new_price:'変更後の価格',index_observation:'原料指数（参考値）',series:'指数系列',value:'値',published_at:'公表日',fetched_at:'取得日',version:'版',approved_by:'承認者',method:'方法',mode:'方式',tax_rate:'税率（架空の設定値）',tax:'税額',total:'合計',subtotal:'小計',items:'品目',conditions:'適用条件',price_versions:'価格履歴',basis:'計算根拠',warnings:'確認事項',simulation_only:'試算のみ',record_id:'記録ID'};
let specs=[],active=null;
const el=id=>document.getElementById(id), label=key=>labels[key]||key.replaceAll('_',' ');
function display(value){if(value===null)return '未確認';if(typeof value==='boolean')return value?'はい':'いいえ';return String(value);}
function table(value){const node=document.createElement('div');if(Array.isArray(value)){if(!value.length){node.textContent='該当なし';return node;}value.forEach((entry,index)=>{const row=document.createElement('div');row.className='nested';if(typeof entry==='object'&&entry!==null){const heading=document.createElement('p');heading.textContent=`${index+1}件目`;row.append(heading,table(entry));}else{row.textContent=display(entry);}node.append(row);});return node;}if(value&&typeof value==='object'){const grid=document.createElement('table');Object.entries(value).forEach(([key,entry])=>{const tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.textContent=label(key);if(entry&&typeof entry==='object')td.append(table(entry));else td.textContent=display(entry);tr.append(th,td);grid.append(tr);});node.append(grid);return node;}node.textContent=display(value);return node;}
function make_field(key,value,path,container){if(value&&typeof value==='object'&&!Array.isArray(value)){const group=document.createElement('label');group.className='wide';group.textContent=label(key);const sub=document.createElement('div');sub.className='fields';Object.entries(value).forEach(([child,item])=>make_field(child,item,[...path,child],sub));group.append(sub);container.append(group);return;}const wrap=document.createElement('label');wrap.textContent=label(key);let input;if(Array.isArray(value)){input=document.createElement('textarea');input.value=JSON.stringify(value,null,2);wrap.className='wide';input.dataset.kind='array';}else if(typeof value==='boolean'){input=document.createElement('select');['はい','いいえ'].forEach((text,index)=>{const option=document.createElement('option');option.value=index===0?'true':'false';option.textContent=text;input.append(option);});input.value=String(value);input.dataset.kind='boolean';}else if(key==='xlsx_base64'){input=document.createElement('input');input.type='file';input.accept='.xlsx';input.dataset.kind='file';}else if(['category','price_type'].includes(key)){input=document.createElement('select');(key==='category'?['部品','塗料','溶剤','消耗品']:['仕入','販売']).forEach(text=>{const option=document.createElement('option');option.textContent=text;option.value=text;input.append(option);});input.value=value;}else if(typeof value==='string'&&value.includes('\n')){input=document.createElement('textarea');input.value=value;wrap.className='wide';}else{input=document.createElement('input');input.type=typeof value==='number'?'number':'text';input.step='any';input.value=value===null?'':value;input.dataset.kind=typeof value==='number'?'number':value===null?'nullable':'string';}input.dataset.path=JSON.stringify(path);wrap.append(input);container.append(wrap);}
function select(spec){active=spec;el('idea_id').textContent=spec.idea_id;el('title').textContent=spec.title;el('description').textContent=spec.description;el('fields').replaceChildren();Object.entries(spec.defaults).forEach(([key,value])=>make_field(key,value,[key],el('fields')));el('status').textContent='';document.querySelectorAll('.idea').forEach(button=>button.classList.toggle('active',button.dataset.id===spec.idea_id));}
el('reset').onclick=()=>select(active);
async function collect(){const payload=JSON.parse(JSON.stringify(active.defaults));for(const input of el('fields').querySelectorAll('[data-path]')){const path=JSON.parse(input.dataset.path);let target=payload;path.slice(0,-1).forEach(key=>target=target[key]);let value=input.value;switch(input.dataset.kind){case 'array':value=JSON.parse(value);break;case 'boolean':value=value==='true';break;case 'number':value=value===''?null:Number(value);break;case 'nullable':value=value||null;break;case 'file':if(input.files.length){const bytes=new Uint8Array(await input.files[0].arrayBuffer());if(bytes.length>2500000)throw Error('Excelファイルは2.5MB以下にしてください');let binary='';bytes.forEach(byte=>binary+=String.fromCharCode(byte));value=btoa(binary);}else{value=target[path.at(-1)];}break;}target[path.at(-1)]=value;}return payload;}
el('form').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;el('status').className='';el('status').textContent='確認中…';try{const response=await fetch(`/api/ideas/${active.idea_id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(await collect())});const data=await response.json();if(!response.ok)throw Error(data.error);el('result').replaceChildren(table(data.result));el('status').textContent='確認しました。結果・保存した根拠を表示しています。';await history();}catch(error){el('status').className='error';el('status').textContent=`要確認: ${error.message}`;}finally{button.disabled=false;}};
async function history(){const response=await fetch('/api/prices');if(!response.ok)throw Error('台帳の読込に失敗しました');const data=await response.json();el('history').replaceChildren(table(data.price_versions));}
el('history_button').onclick=()=>history().catch(error=>{el('status').textContent=error.message;});
(async()=>{try{const response=await fetch('/api/ideas');const data=await response.json();specs=data.ideas;el('count').textContent=`30案の道具 · ${specs.length}案を利用可能`;specs.forEach(spec=>{const button=document.createElement('button');button.className='idea';button.dataset.id=spec.idea_id;const span=document.createElement('span');span.textContent=spec.idea_id;button.append(span,document.createTextNode(spec.title));button.onclick=()=>select(spec);el('ideas').append(button);});if(specs.length)select(specs.find(spec=>spec.idea_id==='M07')||specs[0]);await history();}catch(error){el('count').textContent='読込に失敗しました';el('status').textContent=error.message;}})();
</script></html>
